<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/webp" href="logo.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support IDE</title>
  <link rel="stylesheet" href="fonts/carino-fonts.css">
  <style>
    :root {
      /* Carino design tokens (branding.carino.systems) */
      --bg-nav: #0d0d0d;
      --bg-sidebar: #0b0b0b;
      --bg-content: #050505;
      --bg-notes: #0b0b0b;
      --bg-elev: #0d0d0d;
      --accent: #eab308;            /* Sharp Gold — the one accent */
      --accent-faint: rgba(234,179,8,0.06);
      --accent-glow: rgba(234,179,8,0.15);
      --url-card-color: #eab308;
      --text-main: #a3a3a3;
      --text-header: #ffffff;
      --text-muted: #666666;

      /* Static Colors */
      --border: #262626;
      --status-ongoing: #38bdf8;
      --status-pending: #eab308;
      --status-done: #22c55e;
      --tab-inactive: rgba(255,255,255,0.03);
      --tab-active: var(--bg-content);

      --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --display: 'Red Hat Display', var(--sans);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      font-family: var(--sans);
      background: var(--bg-content);
      color: var(--text-main);
      height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
      transition: color 0.2s, background 0.2s;
    }

    /* --- UI COMPONENTS --- */
    #notification-toast {
      position: fixed; top: 76px; right: 20px;
      background: rgba(34,197,94,0.10); color: #86efac;
      border: 1px solid rgba(34,197,94,0.5);
      padding: 10px 16px; border-radius: 8px;
      font-family: var(--mono); font-weight: 700; font-size: 0.76rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 9999; opacity: 0; pointer-events: none;
      transform: translateY(-10px); transition: all 0.2s ease;
    }
    #notification-toast.show { opacity: 1; transform: translateY(0); }

    /* Top Bar */
    #top-bar {
      height: 35px; background: var(--bg-nav);
      display: flex; align-items: flex-end;
      padding-left: 0; border-bottom: 1px solid var(--border);
      user-select: none; padding-right: 15px;
    }

    .tab {
      height: 35px; padding: 0 15px; display: flex; align-items: center;
      gap: 8px; background: var(--tab-inactive); color: var(--text-muted);
      font-family: var(--mono); font-size: 12px; cursor: pointer; border-right: 1px solid var(--border);
      min-width: 120px; max-width: 200px; position: relative;
    }
    .tab.active {
      background: var(--tab-active); color: var(--text-header);
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--bg-content); margin-bottom: -1px;
    }
    .tab.status-ongoing.active { border-top-color: var(--status-ongoing); }
    .tab.status-pending.active { border-top-color: var(--status-pending); }
    .tab.status-done.active    { border-top-color: var(--status-done); }

    .tab-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .tab.status-ongoing .tab-status-dot { background: var(--status-ongoing); }
    .tab.status-pending .tab-status-dot { background: var(--status-pending); }
    .tab.status-done .tab-status-dot    { background: var(--status-done); }

    .tab-close { margin-left: auto; font-size: 14px; padding: 2px 5px; border-radius: 4px; }
    .tab-close:hover { background: var(--accent-faint); color: var(--accent); }

    #new-tab-btn {
      height: 35px; width: 35px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); font-size: 18px; border-radius: 6px;
    }
    #new-tab-btn:hover { color: #050505; background: var(--accent); }

    /* Right Controls (Lang + Info) */
    .top-right-controls {
      margin-left: auto; display: flex; align-items: center; gap: 10px; height: 100%;
    }

    #lang-select {
      background: var(--bg-elev); border: 1px solid var(--border);
      color: var(--text-main); font-family: var(--mono); font-size: 11px;
      border-radius: 6px; padding: 4px 6px;
      outline: none; cursor: pointer; height: 30px;
    }
    #lang-select:hover, #lang-select:focus { border-color: var(--accent); color: var(--text-header); }

    #dim-btn, #reset-btn, #flows-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; transition: 0.18s;
    }
    #dim-btn:hover, #flows-btn:hover { border-color: var(--accent); background: var(--accent); color: #050505; }
    #dim-btn.dim-on, #flows-btn.dim-on { color: var(--accent); border-color: var(--accent); }
    #reset-btn:hover { border-color: var(--err, #ef4444); color: #ef4444; background: rgba(239,68,68,0.08); }

    /* Search */
    #command-palette {
      height: 48px; display: flex; align-items: center; padding: 0 14px;
      border-bottom: 1px solid var(--border); background: var(--bg-content);
    }
    #search-box {
      width: 100%; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text-header);
      padding: 8px 12px; font-family: var(--mono); font-size: 13px; border-radius: 8px; outline: none;
      transition: 0.15s;
    }
    #search-box::placeholder { color: var(--text-muted); }
    #search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }

    /* Layout */
    #workspace { display: flex; flex: 1; overflow: hidden; position: relative; }

    #sidebar {
      width: 300px; background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }

    .sidebar-section { padding: 15px; overflow-y: auto; flex: 1; }
    .control-group { margin-bottom: 12px; }
    .control-group label {
      display: block; font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); opacity: 1; margin-bottom: 5px; font-weight: 500;
    }
    .input-std {
      width: 100%; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text-header); border-radius: 6px;
      padding: 8px 10px; font-family: var(--mono); font-size: 0.8rem; outline: none; transition: 0.15s;
    }
    .input-std:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }

    .sidebar-footer {
      padding: 10px; background: rgba(0,0,0,0.2);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .full-span { grid-column: span 2; }

    .btn {
      background: transparent;
      border: 1px solid var(--border); color: var(--text-main);
      padding: 9px 10px; font-family: var(--mono); font-size: 0.66rem; cursor: pointer;
      text-align: center; text-transform: uppercase; letter-spacing: 0.05em;
      font-weight: 700; border-radius: 6px; transition: 0.18s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-faint); }
    .btn.primary { background: var(--accent); color: #050505; border-color: var(--accent); }
    .btn.primary:hover { background: #fbbf24; color: #050505; box-shadow: 0 4px 16px var(--accent-glow); }

    #content-area {
      flex: 1; padding: 20px; overflow-y: auto;
      background: var(--bg-content); padding-bottom: 200px;
    }

    .category-header {
      font-family: var(--mono); font-size: 0.7rem; font-weight: 700; color: var(--accent);
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border); padding-bottom: 7px;
      margin-top: 24px; margin-bottom: 12px; text-transform: uppercase;
    }
    .category-header:first-child { margin-top: 0; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 12px; cursor: pointer; border-radius: 10px;
      font-family: var(--mono); font-size: 12px;
      color: var(--text-main); transition: all 0.2s;
    }
    .card:hover { background: linear-gradient(145deg,#17120a 0%,#0b0b0b 100%); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,0.5), 0 0 18px var(--accent-glow); }
    .card:active { border-color: var(--accent); transform: translateY(0); }
    .card strong { color: var(--accent); display: block; margin-bottom: 6px; }
    .highlight-var { color: var(--text-header); font-weight: bold; background: var(--accent-faint); border: 1px solid var(--accent-glow); border-radius: 3px; padding: 0 3px; }

    .card.url-card strong { color: var(--url-card-color); }
    .card.card-dim { opacity: 0.2; }
    .control-group.field-filter-focus > label {
      color: var(--accent); opacity: 1;
    }
    .control-group.field-filter-focus > label::after {
      content: " ◉"; font-size: 9px; vertical-align: middle;
    }
    .filter-preview {
      display: block; font-size: 10px; font-family: var(--mono);
      color: var(--text-muted); margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Drawer */
    #notes-drawer {
      position: absolute; bottom: 0; left: 300px; right: 0;
      background: var(--bg-notes); border-top: 1px solid var(--accent); z-index: 100;
      transition: height 0.2s ease; height: 150px; display: flex; flex-direction: column;
    }
    #notes-drawer.minimized { height: 30px; }
    #notes-drawer.maximized { height: 90%; border-top: 4px solid var(--accent); }

    .drawer-header {
      height: 30px; background: var(--bg-card); padding: 0 15px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      cursor: row-resize; user-select: none;
    }
    .drawer-controls span { margin-left: 10px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .drawer-controls span:hover { color: var(--accent); background: var(--accent-faint); }

    #note-input {
      flex: 1; width: 100%; background: transparent; border: none;
      color: var(--text-header); padding: 15px; resize: none;
      font-family: var(--mono); font-size: 13px; outline: none;
    }
    #note-input::placeholder { color: var(--text-muted); }

    #jsonUpload { display: none; }
    #welcome-msg h3 { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--text-header); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

    /* --- Flow cards --- */
    #flows-area { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-content); display: none; }
    .flow-toolbar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .flow-card { cursor: default; }
    .flow-tag {
      display: inline-block; font-size: 10px; color: var(--accent);
      border: 1px solid var(--accent-glow); background: var(--accent-faint);
      border-radius: 4px; padding: 1px 6px; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .flow-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }
    .flow-thumbs { display: flex; gap: 6px; margin-bottom: 8px; }
    .flow-thumbs img { height: 44px; max-width: 90px; object-fit: cover; border: 1px solid var(--border); border-radius: 4px; }
    .flow-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .flow-actions .btn { padding: 6px 8px; font-size: 0.6rem; }
    #flow-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 500; display: none; overflow-y: auto; }
    .flow-editor {
      max-width: 720px; margin: 50px auto; background: var(--bg-elev);
      border: 1px solid var(--border); border-radius: 10px; padding: 18px;
    }
    .flow-editor h3 {
      margin: 0 0 14px; font-family: var(--display); font-size: 0.9rem;
      color: var(--text-header); text-transform: uppercase; letter-spacing: 1px;
    }
    .flow-editor-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .flow-editor-row .control-group { flex: 1; margin-bottom: 0; }
    .flow-step {
      display: flex; gap: 10px; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; margin-bottom: 10px; background: var(--bg-content);
    }
    .flow-step-num { font-family: var(--mono); font-weight: 700; color: var(--accent); width: 22px; text-align: center; flex-shrink: 0; padding-top: 8px; }
    .flow-step-main { flex: 1; min-width: 0; }
    .flow-step textarea {
      width: 100%; min-height: 64px; resize: vertical; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text-header); border-radius: 6px;
      padding: 8px 10px; font-family: var(--mono); font-size: 0.8rem; outline: none; transition: 0.15s;
    }
    .flow-step textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
    .flow-step-img { margin-top: 8px; }
    .flow-step-img img { max-width: 200px; max-height: 110px; display: block; border: 1px solid var(--border); border-radius: 6px; }
    .flow-step-side { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .flow-step-side .btn { padding: 4px 6px; font-size: 0.6rem; }
    .flow-editor-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .flow-hint { font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin: 8px 0 0; }

    /* --- Tab bar merged INTO the Carino navbar (via data-carino-actions) --- */
    #carinoNav #top-bar { height: auto; background: transparent; border: none; padding: 0; align-items: center; gap: 6px; }
    #carinoNav #tabs-container { display: flex; gap: 4px; overflow-x: auto; max-width: 46vw; scrollbar-width: thin; }
    #carinoNav .tab { height: 34px; min-width: auto; max-width: 170px; padding: 0 10px; border: 1px solid #262626; border-right: 1px solid #262626; border-radius: 6px; background: rgba(255,255,255,0.04); }
    #carinoNav .tab.active { border: 1px solid var(--accent); margin-bottom: 0; background: rgba(234,179,8,0.12); color: #fff; }
    #carinoNav .tab.status-ongoing.active { border-color: var(--status-ongoing); }
    #carinoNav .tab.status-pending.active { border-color: var(--status-pending); }
    #carinoNav .tab.status-done.active    { border-color: var(--status-done); }
    #carinoNav #new-tab-btn { height: 34px; width: 34px; border-radius: 6px; color: #aaa; }
    #carinoNav .top-right-controls { height: auto; margin-left: 6px; }
  </style>
</head>
<body>

  <div id="notification-toast">📋 Copied!</div>

  <div id="top-bar" data-carino-actions>
    <div id="tabs-container" style="display:flex;"></div>
    <div id="new-tab-btn" title="New Ticket">+</div>
    
    <div class="top-right-controls">
      <select id="lang-select">
        <option value="en">EN</option>
      </select>
      <div id="flows-btn" title="Flow cards — step-by-step guides">⧉</div>
      <div id="dim-btn" title="Toggle card dimming">◉</div>
      <div id="reset-btn" title="Reset — delete all stored data and load default template">↺</div>
    </div>
  </div>

  <div id="command-palette">
    <input type="text" id="search-box" placeholder="Search..." />
  </div>

  <div id="workspace">
    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="control-group">
          <label>Status</label>
          <select id="status-select" class="input-std">
            <option value="ongoing">🔴 Ongoing</option>
            <option value="pending">🟡 Pending</option>
            <option value="done">🟢 Done</option>
          </select>
        </div>
        <div id="dynamic-inputs"></div>
      </div>
      <div class="sidebar-footer">
        <button class="btn" id="btn-clear">🧹 Clear</button>
        <button class="btn" id="btn-load" onclick="document.getElementById('jsonUpload').click()">📂 Load</button>
        <button class="btn" id="btn-backup">💾 Backup</button>
        <button class="btn primary" id="btn-save">📄 Save Log</button>
      </div>
    </aside>

    <main id="content-area">
      <div id="welcome-msg" style="text-align:center; margin-top:50px; color:var(--text-main); opacity:0.6;">
        <h3>NO CONFIGURATION LOADED</h3>
        <p>Drag & Drop a JSON file here.</p>
      </div>
      <div id="snippets-grid"></div>
    </main>

    <main id="flows-area">
      <div class="flow-toolbar">
        <button class="btn primary" id="flow-new">➕ New Flow</button>
      </div>
      <div class="category-header">Flow Cards</div>
      <div id="flows-grid" class="grid"></div>
    </main>

    <div id="notes-drawer">
      <div class="drawer-header" id="drawer-handle">
        <span id="note-header-text">📝 Notes</span>
        <div class="drawer-controls">
          <span onclick="resizeDrawer('minimized')">_</span>
          <span onclick="resizeDrawer('normal')">☐</span>
          <span onclick="resizeDrawer('maximized')">🗖</span>
        </div>
      </div>
      <textarea id="note-input" placeholder="..."></textarea>
    </div>
  </div>

  <div id="flow-modal">
    <div class="flow-editor">
      <h3>Flow Editor</h3>
      <div class="flow-editor-row">
        <div class="control-group">
          <label>Title</label>
          <input type="text" id="flow-title-input" class="input-std" placeholder="e.g. Clear Chrome Cache">
        </div>
        <div class="control-group">
          <label>Audience / Tag (optional)</label>
          <input type="text" id="flow-tag-input" class="input-std" placeholder="e.g. End Users">
        </div>
      </div>
      <div id="flow-steps"></div>
      <button class="btn" id="flow-add-step">➕ Add Step</button>
      <p class="flow-hint">Paste a screenshot (Ctrl+V) to attach it to the selected step · first line of a step = heading</p>
      <div class="flow-editor-foot">
        <button class="btn" id="flow-cancel">Cancel</button>
        <button class="btn primary" id="flow-save">💾 Save Flow</button>
      </div>
    </div>
  </div>
  <input type="file" id="flow-img-upload" accept="image/*" style="display:none">

  <input type="file" id="jsonUpload" accept=".json" />
  <script src="./assets/js/default.js"></script>
<script>
  // --- DEFAULT JSON (FOR FIRST LOAD) ---
  

  // --- STATE ---
  const hostHash = Math.random().toString(36).substring(2, 8).toUpperCase();
  let sessions = []; 
  let activeSessionId = null;
  let snippetConfig = {}; 
  let filters = {};
  let hiddenFields = {};
  let fieldOptions = {};
  let fieldCards = {};
  let focusedField = null;
  let dimmingEnabled = true;
  let currentLang = "en"; // Default
  let defaultLangFallback = "en";

  const LS_CONFIG = "support_ide_config";
  const LS_SESSIONS = "support_ide_sessions";
  const LS_ACTIVE = "support_ide_active";

  // --- INIT ---
  window.addEventListener('load', () => {
    // 1. Check for Saved Data (Priority #1)
    const savedConfig = localStorage.getItem(LS_CONFIG);

    if (savedConfig) {
      // EXISTING USER: Load from memory
      try {
        const json = JSON.parse(savedConfig);
        loadConfigInternal(json, false); // false = do not wipe sessions yet
      } catch(e) { console.error("Config corrupt", e); }
    } 
    else if (typeof DEFAULT_CONFIG !== 'undefined') {
      // NEW USER (Offline): Load from default.js
      console.log("Loading Default Config");
      loadConfigInternal(DEFAULT_CONFIG, true); // true = wipe and start fresh
    }

    // 2. Restore Sessions (Only if we didn't just do a fresh start)
    const savedSessions = localStorage.getItem(LS_SESSIONS);
    const savedActive = localStorage.getItem(LS_ACTIVE);
    
    // If we have saved sessions AND we loaded a saved config, restore them.
    if(savedConfig && savedSessions && JSON.parse(savedSessions).length > 0) {
      sessions = JSON.parse(savedSessions);
      activeSessionId = savedActive ? parseInt(savedActive) : sessions[0].id;
      if(!sessions.find(s => s.id === activeSessionId)) activeSessionId = sessions[0].id;
      renderTabs();
      switchTab(activeSessionId);
    } else {
      // If sessions are empty (and we have a config loaded), make sure we have at least 1 ticket
      if(sessions.length === 0 && (savedConfig || typeof DEFAULT_CONFIG !== 'undefined')) {
         // If loadConfigInternal(..., true) ran, it already created a session. 
         // But just in case:
         if(sessions.length === 0) createNewSession(true);
      }
    }
  });

  setInterval(() => {
    if(activeSessionId) saveCurrentStateToMemory(); 
    localStorage.setItem(LS_SESSIONS, JSON.stringify(sessions));
    localStorage.setItem(LS_ACTIVE, activeSessionId);
  }, 2000);

  // --- LANGUAGE ENGINE ---
  function initLanguageSelector(config) {
    const select = document.getElementById("lang-select");
    select.innerHTML = ""; 

    let langs = ["en"];
    if(config.config) {
        if(config.config.supportedLangs) langs = config.config.supportedLangs;
        if(config.config.defaultLang) {
            defaultLangFallback = config.config.defaultLang;
            if(!currentLang) currentLang = defaultLangFallback;
        }
    }
    if(!langs.includes(currentLang)) currentLang = defaultLangFallback;

    langs.forEach(code => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.innerText = code.toUpperCase();
        select.appendChild(opt);
    });

    select.value = currentLang;
    
    select.addEventListener("change", (e) => {
        currentLang = e.target.value;
        refreshUI();
    });
  }

  function getLocalizedText(obj) {
    if (typeof obj === 'string') return obj; // Not translated
    if (!obj) return "";
    
    if(obj[currentLang]) return obj[currentLang];
    if(obj[defaultLangFallback]) return obj[defaultLangFallback];
    
    const keys = Object.keys(obj);
    if(keys.length > 0) return obj[keys[0]];
    return "";
  }
  
  function translateKey(key) {
    if(snippetConfig.dictionary && snippetConfig.dictionary[key]) {
        return getLocalizedText(snippetConfig.dictionary[key]);
    }
    return key;
  }

  function applyFilter(key, val) {
    if (!filters[key] || !filters[key].regex) return val;
    try {
      const m = val.match(new RegExp(filters[key].regex));
      if (!m) return val;
      if (filters[key].group !== undefined) return m[filters[key].group] ?? val;
      if (m.groups && Object.keys(m.groups).length > 0) return Object.values(m.groups)[0] ?? val;
      return m[1] !== undefined ? m[1] : m[0];
    } catch(e) { return val; }
  }

  function applyFieldCardFiltering() {
    const cards = document.querySelectorAll("#snippets-grid .card[data-card-label]");
    if (!dimmingEnabled || !focusedField || !fieldCards[focusedField]) {
      cards.forEach(c => c.classList.remove("card-dim"));
      return;
    }
    const valueMap = fieldCards[focusedField];
    const isDropdown = Array.isArray(fieldOptions[focusedField]);
    let relatedSet;
    if (isDropdown) {
      const session = sessions.find(s => s.id === activeSessionId);
      const val = session ? (session.data[focusedField] || "") : "";
      const related = val && valueMap[val];
      if (!related) { cards.forEach(c => c.classList.remove("card-dim")); return; }
      relatedSet = new Set(related);
    } else {
      relatedSet = new Set(Object.values(valueMap).flat());
    }
    cards.forEach(card => {
      card.classList.toggle("card-dim", !relatedSet.has(card.getAttribute("data-card-label")));
    });
  }

    if(snippetConfig.dictionary) applyUILabels(snippetConfig.dictionary);

  function applyTheme(theme) {
    const root = document.documentElement;
    if(theme.nav) root.style.setProperty('--bg-nav', theme.nav);
    if(theme.sidebar) root.style.setProperty('--bg-sidebar', theme.sidebar);
    if(theme.content) root.style.setProperty('--bg-content', theme.content);
    if(theme.notes) root.style.setProperty('--bg-notes', theme.notes);
    if(theme.accent) root.style.setProperty('--accent', theme.accent);
    if(theme.urlCard) root.style.setProperty('--url-card-color', theme.urlCard);
    if(theme.textMain) root.style.setProperty('--text-main', theme.textMain);
    if(theme.textHeader) root.style.setProperty('--text-header', theme.textHeader);

  // --- TABS ---
  function createNewSession(useDefaults = false) {
    const id = Date.now();
    const newSession = { id: id, title: `Ticket ${sessions.length + 1}`, status: 'ongoing', data: {}, note: "" };
    
    if(snippetConfig.fields) {
      Object.keys(snippetConfig.fields).forEach(k => {
          if (useDefaults || (hiddenFields && hiddenFields[k])) {
             newSession.data[k] = snippetConfig.fields[k];
          } else {
             newSession.data[k] = ""; 
          }
      });
    }
    sessions.push(newSession);
    switchTab(id);
    renderTabs();
  }

  function switchTab(id) {
    if (activeSessionId) saveCurrentStateToMemory();
    activeSessionId = id;
    const session = sessions.find(s => s.id === id);
    if(!session) return; 

    // Restore UI Inputs
    const inputsContainer = document.getElementById("dynamic-inputs");
    const controls = inputsContainer.querySelectorAll("[data-key]");

    if(controls.length > 0 && snippetConfig.fields) {
        controls.forEach(ctrl => {
          const key = ctrl.getAttribute("data-key");
          ctrl.value = session.data[key] !== undefined ? session.data[key] : "";
          const fp = ctrl.parentElement.querySelector(".filter-preview");
          if(fp) {
            const filtered = applyFilter(key, ctrl.value);
            fp.textContent = (filtered !== ctrl.value && ctrl.value) ? `→ ${filtered}` : "";
          }
        });
    } else if (snippetConfig.fields) {
        renderSidebarInputs(snippetConfig.fields);
    }

    document.getElementById("note-input").value = session.note || "";
    document.getElementById("status-select").value = session.status;
    updateNoteHeader(session.title);
    renderTabs();
    refreshUI(); 
  }

  function saveCurrentStateToMemory() {
    const session = sessions.find(s => s.id === activeSessionId);
    if (!session) return;
    document.querySelectorAll("#dynamic-inputs [data-key]").forEach(ctrl => {
      session.data[ctrl.getAttribute("data-key")] = ctrl.value;
    });
    session.note = document.getElementById("note-input").value;
    session.status = document.getElementById("status-select").value;
  }

  function closeTab(e, id) {
    e.stopPropagation();
    if (sessions.length === 1) return alert("Cannot close last tab");
    const index = sessions.findIndex(s => s.id === id);
    sessions.splice(index, 1);
    if (id === activeSessionId) switchTab(sessions[Math.max(0, index - 1)].id);
    else renderTabs();
  }

  function renderTabs() {
    const container = document.getElementById("tabs-container");
    container.innerHTML = "";
    sessions.forEach((s, index) => {
      s.title = `Ticket ${index + 1}`; 
      const el = document.createElement("div");
      el.className = `tab status-${s.status} ${s.id === activeSessionId ? 'active' : ''}`;
      el.onclick = () => switchTab(s.id);
      el.innerHTML = `<div class="tab-status-dot"></div><span>${s.title}</span><span class="tab-close" onclick="closeTab(event, ${s.id})">×</span>`;
      container.appendChild(el);
    });
  }

  // --- FILE HANDLING ---
  function loadConfigInternal(json, hardReset = true) {
    if(hardReset) activeSessionId = null; 

    snippetConfig = json;
    hiddenFields = json.hidden || {};
    filters = json.filters || {};
    fieldOptions = json.fieldOptions || {};
    fieldCards = json.fieldCards || {};
    
    initLanguageSelector(json);

    if(json.theme) applyTheme(json.theme);
    localStorage.setItem(LS_CONFIG, JSON.stringify(json));
    document.getElementById("welcome-msg").style.display = "none";
    
    renderSidebarInputs(json.fields);

    if(hardReset) {
      sessions = [];
      createNewSession(true); 
    } else {
        if(activeSessionId) switchTab(activeSessionId);
    }
    refreshUI(); 
  }

  function readJsonFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const json = JSON.parse(e.target.result);
        if(json.appType === "workspace_backup") {
          if(confirm("Restore Backup?")) {
             activeSessionId = null; 
             loadConfigInternal(json.config, false); 
             sessions = json.sessions;
             switchTab(json.activeId);
             showToast("Backup Restored");
          }
        } else {
           if(confirm("Load Config? (Clears Tickets)")) {
             loadConfigInternal(json, true); 
             showToast("Config Loaded");
           }
        }
      } catch(err) { alert("Invalid JSON"); }
    };
    reader.readAsText(file);
  }

  function renderSidebarInputs(fields) {
    const container = document.getElementById("dynamic-inputs");
    container.innerHTML = "";
    focusedField = null;
    if(!fields) return;
    const session = sessions.find(s => s.id === activeSessionId);

    Object.entries(fields).forEach(([key, defaultVal]) => {
      if(hiddenFields && hiddenFields[key]) return;

      const group = document.createElement("div");
      group.className = "control-group";
      const label = document.createElement("label");
      label.textContent = key;

      let valueToSet = defaultVal;
      if (session) {
        if (session.data[key] === undefined) session.data[key] = "";
        valueToSet = session.data[key];
      }

      const options = fieldOptions[key];
      const hasOptions = Array.isArray(options) && options.length > 0;
      const hasFilter = !!(filters[key] && filters[key].regex);

      let control;
      if (hasOptions) {
        control = document.createElement("select");
        control.className = "input-std";
        control.setAttribute("data-key", key);
        const emptyOpt = document.createElement("option");
        emptyOpt.value = ""; emptyOpt.textContent = "—";
        control.appendChild(emptyOpt);
        options.forEach(opt => {
          const el = document.createElement("option");
          el.value = opt; el.textContent = opt;
          control.appendChild(el);
        });
        control.value = valueToSet;
      } else {
        control = document.createElement("input");
        control.type = "text"; control.className = "input-std";
        control.setAttribute("data-key", key);
        control.value = valueToSet;
      }

      let preview = null;
      const updatePreview = (val) => {
        if (!preview) return;
        const filtered = applyFilter(key, val);
        preview.textContent = (filtered !== val && val) ? `→ ${filtered}` : "";
      };

      const onChange = (e) => {
        const currentSess = sessions.find(s => s.id === activeSessionId);
        if(currentSess) currentSess.data[key] = e.target.value;
        updatePreview(e.target.value);
        renderSnippets();
      };

      control.addEventListener(hasOptions ? "change" : "input", onChange);

      if (fieldCards[key]) {
        const activateDim = () => {
          if (!dimmingEnabled) return;
          focusedField = key;
          document.querySelectorAll("#dynamic-inputs .control-group.field-filter-focus")
            .forEach(g => g.classList.remove("field-filter-focus"));
          group.classList.add("field-filter-focus");
          applyFieldCardFiltering();
        };
        control.addEventListener(hasOptions ? 'click' : 'focus', activateDim);
      } else {
        const clearDim = () => {
          if (!dimmingEnabled) return;
          focusedField = null;
          document.querySelectorAll("#dynamic-inputs .control-group.field-filter-focus")
            .forEach(g => g.classList.remove("field-filter-focus"));
          applyFieldCardFiltering();
        };
        control.addEventListener(hasOptions ? 'click' : 'focus', clearDim);
      }

      group.appendChild(label);
      group.appendChild(control);

      if (hasFilter) {
        preview = document.createElement("small");
        preview.className = "filter-preview";
        updatePreview(valueToSet);
        group.appendChild(preview);
      }

      container.appendChild(group);
    });
  }

  function renderSnippets() {
    const container = document.getElementById("snippets-grid");
    container.innerHTML = "";
    if(!snippetConfig || !snippetConfig.fields) return;

    const session = sessions.find(s => s.id === activeSessionId);
    const safeData = session ? session.data : {};

    const resolve = (k) => {
      const raw = safeData[k] || (hiddenFields && hiddenFields[k]) || "";
      return raw ? applyFilter(k, raw) : `[${k}]`;
    };
    const toDisplay = (text) => text.replace(/\[([^\]]+)\]/g, (_, k) => `<span class="highlight-var">${resolve(k)}</span>`);
    const toRaw    = (text) => text.replace(/\[([^\]]+)\]/g, (_, k) => resolve(k));

    const ignore = ["fields", "logo", "note", "hidden", "filters", "fieldOptions", "fieldCards", "googleSheetFields", "theme", "ui", "dictionary", "config"];

    Object.entries(snippetConfig).forEach(([catKey, content]) => {
      if(ignore.includes(catKey)) return;

      const header = document.createElement("div");
      header.className = "category-header"; header.textContent = translateKey(catKey);
      container.appendChild(header);
      const grid = document.createElement("div"); grid.className = "grid";

      if(Array.isArray(content.shortcuts)) {
        content.shortcuts.forEach(sc => {
          const resolvedUrl = toRaw(sc.url);
          const card = document.createElement("div");
          card.className = "card url-card";
          card.setAttribute("data-card-label", sc.label);
          card.innerHTML = `<strong>${sc.label} ↗</strong>${toDisplay(sc.url)}`;
          card.onclick = () => window.open(resolvedUrl, "_blank", "noopener");
          grid.appendChild(card);
        });
      }

      Object.entries(content).forEach(([labelKey, value]) => {
        if(["tags", "shortcuts"].includes(labelKey)) return;
        const labelText = translateKey(labelKey);
        const text = getLocalizedText(value);
        const isUrl = /^https?:\/\//.test(text.trim());
        const card = document.createElement("div");
        card.className = isUrl ? "card url-card" : "card";
        card.setAttribute("data-card-label", labelKey);
        card.innerHTML = `<strong>${labelText}${isUrl ? " ↗" : ""}</strong>${toDisplay(text)}`;
        if(isUrl) {
          card.onclick = () => window.open(toRaw(text), "_blank", "noopener");
        } else {
          card.onclick = () => { navigator.clipboard.writeText(toRaw(text)); showToast("📋 Copied!"); };
        }
        grid.appendChild(card);
      });
      container.appendChild(grid);
    });

    applyFieldCardFiltering();
    const searchVal = document.getElementById("search-box").value;
    if(searchVal) document.getElementById("search-box").dispatchEvent(new Event('input'));
  }

    const backup = {
      // 1. Instructions (Pseudo-comment)
        _instructions: "Edit the 'config' section below to change themes, language, or snippets. Drag this file back into the app to load.",
      
      // 2. Metadata
      appType: "workspace_backup",
      timestamp: new Date().toISOString(),
      
      // 3. The Editable Config (Top of file)
      config: snippetConfig,
      
      // 4. Session Data (Bottom of file - less likely to be edited)
      activeId: activeSessionId,
      sessions: sessions
    };

    // The '2' argument here adds 2 spaces of indentation, making it readable

    downloadFile(`backup-${new Date().toISOString().slice(0,10)}.json`, prettyJSON);

  document.getElementById("btn-save").addEventListener("click", () => {
    const session = sessions.find(s => s.id === activeSessionId);
    if(!session) return;
    const now = new Date();
    const filename = `${now.toISOString().split('T')[0]}-${hostHash}.txt`;
    let content = `LOG ID: ${hostHash}\nDATE: ${now.toLocaleString()}\nSTATUS: ${session.status.toUpperCase()}\n----------------\n`;
    Object.entries(session.data).forEach(([k, v]) => { if(v) content += `${k}: ${v}\n`; });
    content += `----------------\nNOTES:\n${session.note}\n`;
    downloadFile(filename, content); showToast("Log Saved");
  });

  function downloadFile(name, content) {
    const blob = new Blob([content], {type: "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

    document.getElementById("sidebar").style.display = flowsView ? "none" : "flex";
    document.getElementById("notes-drawer").style.display = flowsView ? "none" : "flex";
    document.getElementById("flows-area").style.display = flowsView ? "block" : "none";
    document.getElementById("flows-btn").classList.toggle("dim-on", flowsView);
    if (flowsView) renderFlows();
  }
  document.getElementById("flows-btn").addEventListener("click", toggleFlowsView);

  // --- Cards grid ---
  function renderFlows() {
    const grid = document.getElementById("flows-grid");
    grid.innerHTML = "";
    getFlows().forEach(flow => {
      const builtin = isBuiltinFlow(flow.id);
      const edited = builtin && !!flowStore.overrides[flow.id];
      const card = document.createElement("div");
      card.className = "card flow-card";
      let html = `<strong>${escapeFlowHtml(flow.title)}</strong>`;
      if (flow.tag) html += `<span class="flow-tag">${escapeFlowHtml(flow.tag)}</span>`;
      html += `<div class="flow-meta">${flow.steps.length} steps · ${builtin ? (edited ? "builtin (edited)" : "builtin") : "custom"}</div>`;
      const thumbs = flow.steps.filter(st => st.img).slice(0, 3);
      if (thumbs.length) html += `<div class="flow-thumbs">${thumbs.map(st => `<img src="${escapeFlowHtml(st.img)}">`).join("")}</div>`;
      card.innerHTML = html;
      const actions = document.createElement("div");
      actions.className = "flow-actions";
      actions.appendChild(flowBtn("✏️ Edit", () => openFlowEditor(flow.id)));
      actions.appendChild(flowBtn("🖼️ Copy as image", () => copyFlowImage(flow)));
      actions.appendChild(flowBtn("⬇ PNG", () => downloadFlowImage(flow)));
      if (!builtin) actions.appendChild(flowBtn("🗑 Delete", () => deleteFlow(flow.id)));
      else if (edited) actions.appendChild(flowBtn("↺ Revert", () => revertFlow(flow.id)));
      card.appendChild(actions);
      grid.appendChild(card);
    });
    const searchVal = document.getElementById("search-box").value;
    if (searchVal) document.getElementById("search-box").dispatchEvent(new Event("input"));
  }

  function deleteFlow(id) {
    if (!confirm("Delete this flow?")) return;
    flowStore.user = flowStore.user.filter(f => f.id !== id);
    saveFlowStore(); renderFlows(); showToast("🗑 Flow deleted");
  }
  function revertFlow(id) {
    if (!confirm("Revert this builtin flow to its original version?")) return;
    delete flowStore.overrides[id];
    saveFlowStore(); renderFlows(); showToast("↺ Flow reverted");
  }

  // --- Editor ---
  function openFlowEditor(id) {
    const src = id ? getFlows().find(f => f.id === id) : null;
    flowDraft = src ? JSON.parse(JSON.stringify(src)) : { id: null, title: "", tag: "", steps: [{ text: "" }] };
    flowActiveStep = 0;
    document.getElementById("flow-title-input").value = flowDraft.title;
    document.getElementById("flow-tag-input").value = flowDraft.tag || "";
    renderFlowSteps();
    document.getElementById("flow-modal").style.display = "block";
  }
  function closeFlowEditor() {
    flowDraft = null;
    document.getElementById("flow-modal").style.display = "none";
  }

  function renderFlowSteps() {
    const wrap = document.getElementById("flow-steps");
    wrap.innerHTML = "";
    flowDraft.steps.forEach((step, idx) => {
      const row = document.createElement("div");
      row.className = "flow-step";
      const num = document.createElement("div");
      num.className = "flow-step-num"; num.textContent = idx + 1;
      const main = document.createElement("div");
      main.className = "flow-step-main";
      const ta = document.createElement("textarea");
      ta.value = step.text || "";
      ta.placeholder = "Step text — first line is the heading…";
      ta.addEventListener("input", (e) => { step.text = e.target.value; });
      ta.addEventListener("focus", () => { flowActiveStep = idx; });
      main.appendChild(ta);
      if (step.img) {
        const holder = document.createElement("div");
        holder.className = "flow-step-img";
        const im = document.createElement("img"); im.src = step.img;
        holder.appendChild(im);
        main.appendChild(holder);
      }
      const side = document.createElement("div");
      side.className = "flow-step-side";
      side.appendChild(flowBtn("↑", () => moveFlowStep(idx, -1)));
      side.appendChild(flowBtn("↓", () => moveFlowStep(idx, 1)));
      side.appendChild(flowBtn("📷", () => { flowImgTarget = idx; document.getElementById("flow-img-upload").click(); }));
      if (step.img) side.appendChild(flowBtn("✂🖼", () => { delete step.img; renderFlowSteps(); }));
      side.appendChild(flowBtn("✕", () => {
        if (flowDraft.steps.length === 1) return showToast("⚠️ A flow needs at least one step");
        flowDraft.steps.splice(idx, 1); renderFlowSteps();
      }));
      row.appendChild(num); row.appendChild(main); row.appendChild(side);
      wrap.appendChild(row);
    });
  }

  function moveFlowStep(idx, dir) {
    const to = idx + dir;
    if (to < 0 || to >= flowDraft.steps.length) return;
    const moved = flowDraft.steps.splice(idx, 1)[0];
    flowDraft.steps.splice(to, 0, moved);
    flowActiveStep = to;
    renderFlowSteps();
  }

  function saveFlowDraft() {
    if (!flowDraft) return;
    flowDraft.title = document.getElementById("flow-title-input").value.trim();
    flowDraft.tag = document.getElementById("flow-tag-input").value.trim();
    if (!flowDraft.title) return showToast("⚠️ Title required");
    flowDraft.steps = flowDraft.steps.filter(st => (st.text && st.text.trim()) || st.img);
    if (!flowDraft.steps.length) return showToast("⚠️ At least one step required");
    if (flowDraft.id && isBuiltinFlow(flowDraft.id)) {
      flowStore.overrides[flowDraft.id] = flowDraft; // copy-on-write, builtin stays intact
    } else if (flowDraft.id) {
      flowStore.user = flowStore.user.map(f => f.id === flowDraft.id ? flowDraft : f);
    } else {
      flowDraft.id = "u" + Date.now();
      flowStore.user.push(flowDraft);
    }
    saveFlowStore(); closeFlowEditor(); renderFlows(); showToast("💾 Flow saved");
  }

  document.getElementById("flow-new").addEventListener("click", () => openFlowEditor(null));
  document.getElementById("flow-save").addEventListener("click", saveFlowDraft);
  document.getElementById("flow-cancel").addEventListener("click", closeFlowEditor);
  document.getElementById("flow-add-step").addEventListener("click", () => {
    if (!flowDraft) return;
    flowDraft.steps.push({ text: "" });
    flowActiveStep = flowDraft.steps.length - 1;
    renderFlowSteps();
  });
  document.getElementById("flow-modal").addEventListener("click", (e) => {
    if (e.target.id === "flow-modal") closeFlowEditor();
  });

  // --- Step images: paste from clipboard or pick a file, downscaled to ≤900px ---
  document.getElementById("flow-modal").addEventListener("paste", (e) => {
    if (!flowDraft || !e.clipboardData) return;
    const items = e.clipboardData.items || [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image/") === 0) {
        e.preventDefault();
        downscaleFlowImage(items[i].getAsFile(), (dataUrl) => {
          const step = flowDraft && (flowDraft.steps[flowActiveStep] || flowDraft.steps[0]);
          if (step) { step.img = dataUrl; renderFlowSteps(); showToast("🖼️ Image pasted"); }
        });
        return;
      }
    }
  });

  document.getElementById("flow-img-upload").addEventListener("change", (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || !flowDraft) return;
    downscaleFlowImage(file, (dataUrl) => {
      const step = flowDraft && flowDraft.steps[flowImgTarget];
      if (step) { step.img = dataUrl; renderFlowSteps(); }
    });
  });

  function downscaleFlowImage(file, cb) {
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const w = Math.min(900, img.naturalWidth || 900);
      const h = Math.max(1, Math.round((img.naturalHeight || 1) * (w / (img.naturalWidth || w))));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      cb(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); showToast("⚠️ Could not read image"); };
    img.src = URL.createObjectURL(file);
  }

  // --- Share as image: pure-canvas PNG render (no html2canvas) ---
  function wrapFlowText(ctx, text, maxW) {
    const out = [];
    String(text).split("\n").forEach(line => {
      let cur = "";
      line.split(" ").forEach(word => {
        const test = cur ? cur + " " + word : word;
        if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = word; }
        else cur = test;
        while (ctx.measureText(cur).width > maxW && cur.length > 1) {
          let cut = cur.length - 1;
          while (cut > 1 && ctx.measureText(cur.slice(0, cut)).width > maxW) cut--;
          out.push(cur.slice(0, cut)); cur = cur.slice(cut);
        }
      });
      out.push(cur);
    });
    return out;
  }

  function loadFlowImages(flow, cb) {
    const imgs = {};
    const srcs = flow.steps.map(st => st.img).filter(Boolean);
    let left = srcs.length;
    if (!left) return cb(imgs);
    srcs.forEach(src => {
      const im = new Image();
      im.onload = im.onerror = () => { imgs[src] = im; if (--left === 0) cb(imgs); };
      im.src = src;
    });
  }

  function renderFlowCanvas(flow, cb) {
    const go = () => loadFlowImages(flow, (imgs) => cb(drawFlowCanvas(flow, imgs)));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
    else go();
  }

  function drawFlowCanvas(flow, imgs) {
    const S = 2, W = 760, pad = 28, numW = 44;
    const textX = pad + numW, textW = W - textX - pad, lineH = 20;
    const headFont = '700 15px "IBM Plex Sans", sans-serif';
    const bodyFont = '400 13.5px "IBM Plex Sans", sans-serif';
    const m = document.createElement("canvas").getContext("2d");

    // layout pass
    const blocks = flow.steps.map(step => {
      const lines = String(step.text || "").split("\n");
      m.font = headFont;
      const head = wrapFlowText(m, lines[0] || "", textW);
      m.font = bodyFont;
      const body = lines.length > 1 ? wrapFlowText(m, lines.slice(1).join("\n"), textW) : [];
      const textH = (head.length + body.length) * lineH;
      let imgW = 0, imgH = 0;
      const im = step.img && imgs[step.img];
      if (im && im.naturalWidth) {
        imgW = Math.min(textW, im.naturalWidth);
        imgH = Math.round(im.naturalHeight * (imgW / im.naturalWidth));
      }
      return { head, body, textH, im, imgW, imgH, h: Math.max(textH + (imgH ? imgH + 10 : 0), 28) };
    });

    const headerH = flow.tag ? 92 : 76;
    const stepGap = 20, footerH = 40;
    const H = headerH + blocks.reduce((a, b) => a + b.h + stepGap, 0) + footerH;

    const canvas = document.createElement("canvas");
    canvas.width = W * S; canvas.height = H * S;
    const ctx = canvas.getContext("2d");
    ctx.scale(S, S);

    // dark card background + gold accent header
    ctx.fillStyle = "#0b0b0b"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#eab308"; ctx.fillRect(0, 0, W, 4);
    ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    ctx.font = '700 24px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = "#ffffff";
    ctx.fillText(flow.title, pad, 46);
    if (flow.tag) {
      ctx.font = '700 11px "IBM Plex Mono", monospace';
      ctx.fillStyle = "#eab308";
      ctx.fillText(String(flow.tag).toUpperCase(), pad, 68);
    }
    ctx.strokeStyle = "#262626"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, headerH - 14); ctx.lineTo(W - pad, headerH - 14); ctx.stroke();

    let y = headerH + 8;
    blocks.forEach((b, i) => {
      ctx.beginPath();
      ctx.arc(pad + 13, y + 9, 13, 0, Math.PI * 2);
      ctx.strokeStyle = "#eab308"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = '700 13px "IBM Plex Mono", monospace';
      ctx.fillStyle = "#eab308"; ctx.textAlign = "center";
      ctx.fillText(String(i + 1), pad + 13, y + 14);
      ctx.textAlign = "left";

      let ly = y + 14;
      ctx.font = headFont; ctx.fillStyle = "#ffffff";
      b.head.forEach(line => { ctx.fillText(line, textX, ly); ly += lineH; });
      ctx.font = bodyFont; ctx.fillStyle = "#a3a3a3";
      b.body.forEach(line => { ctx.fillText(line, textX, ly); ly += lineH; });
      if (b.im && b.imgW) {
        const iy = y + b.textH + 6;
        ctx.drawImage(b.im, textX, iy, b.imgW, b.imgH);
        ctx.strokeStyle = "#262626"; ctx.lineWidth = 1;
        ctx.strokeRect(textX + 0.5, iy + 0.5, b.imgW - 1, b.imgH - 1);
      }
      y += b.h + stepGap;
    });

    ctx.font = '400 10px "IBM Plex Mono", monospace';
    ctx.fillStyle = "#666666";
    ctx.fillText("support.carino.systems", pad, H - 16);
    return canvas;
  }

  function flowSlug(t) {
    return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "flow";
  }

  function downloadFlowCanvas(canvas, flow, msg) {
    canvas.toBlob((blob) => {
      if (!blob) return showToast("⚠️ Image export failed");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = flowSlug(flow.title) + ".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      showToast(msg);
    }, "image/png");
  }

  function downloadFlowImage(flow) {
    renderFlowCanvas(flow, (canvas) => downloadFlowCanvas(canvas, flow, "⬇ PNG downloaded"));
  }

  function copyFlowImage(flow) {
    renderFlowCanvas(flow, (canvas) => {
      if (!navigator.clipboard || !window.ClipboardItem) {
        return downloadFlowCanvas(canvas, flow, "Clipboard unavailable — PNG downloaded");
      }
      canvas.toBlob((blob) => {
        if (!blob) return showToast("⚠️ Image export failed");
        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
          .then(() => showToast("🖼️ Flow image copied"))
          .catch(() => downloadFlowCanvas(canvas, flow, "Clipboard blocked — PNG downloaded"));
      }, "image/png");
    });
  }
</script>
  <script src="carino-navbar.js" data-app="Support" defer></script>
</body>
